[package]
name = "maafw-screencap"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[dependencies]

[features]
default = []
windows-gdi = ["dep:windows-bindgen", "dep:windows-link"]
windows-print-window = ["dep:windows-bindgen", "dep:windows-link"]
windows-screen-dc = ["dep:windows-bindgen", "dep:windows-link"]
windows-frame-pool = ["dep:windows-bindgen", "dep:windows-link", "dep:windows-core", "dep:windows-future"]
windows-desktop-dup = ["dep:windows-bindgen", "dep:windows-link", "dep:windows-core"]
windows-desktop-dup-window = ["windows-desktop-dup"]
windows-manager = ["windows-gdi", "windows-print-window", "windows-screen-dc", "windows-frame-pool", "windows-desktop-dup-window"]
# Private consumer plus an unfinished native daemon/SHM migration.
linux-pipewire = ["dep:pipewire", "dep:rustix"]
prototype-windows = ["dep:windows-bindgen", "dep:windows-link"]
prototype-windows-com = ["prototype-windows", "dep:windows-core", "dep:windows-future"]
prototype-linux-pipewire = ["dep:pipewire"]
prototype-linux-wlr = ["dep:wayland-client", "dep:wayland-backend", "dep:wayland-protocols-wlr", "dep:rustix", "dep:memmap2"]
prototype-macos = ["dep:objc2", "dep:block2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:objc2-screen-capture-kit", "dep:objc2-core-media", "dep:objc2-core-video", "dep:objc2-core-foundation", "dep:objc2-core-graphics"]

[target.'cfg(target_os = "windows")'.dependencies]
windows-link = { version = "0.100", optional = true }
# P0 and private FramePool consume projected interfaces, not authored COM classes.
windows-core = { version = "0.100", optional = true, default-features = false, features = ["std"] }
windows-future = { version = "0.100", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", optional = true, features = ["v1_2_0"] }
wayland-client = { version = "0.31", optional = true }
wayland-backend = { version = "0.3", optional = true, features = ["client_system"] }
wayland-protocols-wlr = { version = "0.3", optional = true, features = ["client"] }
rustix = { version = "1", optional = true, features = ["fs", "event", "mm"] }
memmap2 = { version = "0.9", optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Loader ABI for explicit private OpenCV acceptance adapters, never core runtime.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSArray", "NSDate", "NSError", "NSGeometry", "NSRunLoop", "NSString"] }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSApplication", "NSColor", "NSEvent", "NSGraphics", "NSResponder", "NSRunningApplication", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-screen-capture-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "SCScreenshotManager", "SCShareableContent", "SCStream", "block2", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }
objc2-core-media = { version = "0.3", optional = true, default-features = false, features = ["std", "CMSampleBuffer", "objc2-core-video"] }
objc2-core-video = { version = "0.3", optional = true, default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-core-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "CFCGTypes", "CFString"] }
objc2-core-graphics = { version = "0.3", optional = true, default-features = false, features = ["std", "CGColorSpace", "CGWindow"] }

[build-dependencies]
windows-bindgen = { version = "0.100", optional = true }

[[test]]
name = "p0-interop"
path = "tests/prototypes/main.rs"

[[test]]
name = "p0-native"
path = "tests/prototypes/native.rs"
required-features = ["prototype-windows"]

[[test]]
name = "p0-macos"
path = "tests/prototypes/macos_main.rs"
harness = false
required-features = ["prototype-macos"]

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"
