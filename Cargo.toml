[package]
name = "maafw-screencap"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[dependencies]

[features]
default = []
prototype-windows = ["dep:windows-bindgen", "dep:windows-link"]
prototype-windows-com = ["prototype-windows", "dep:windows-core", "dep:windows-future"]
prototype-linux-pipewire = ["dep:pipewire"]
prototype-macos = ["dep:objc2", "dep:block2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:objc2-screen-capture-kit", "dep:objc2-core-media", "dep:objc2-core-video", "dep:objc2-core-foundation", "dep:objc2-core-graphics"]

[target.'cfg(target_os = "windows")'.dependencies]
windows-link = { version = "0.100", optional = true }
# This prototype consumes projected interfaces; it does not author COM classes.
windows-core = { version = "0.100", optional = true, default-features = false, features = ["std"] }
windows-future = { version = "0.100", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", optional = true, features = ["v1_2_0"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSArray", "NSDate", "NSError", "NSGeometry", "NSRunLoop", "NSString"] }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSApplication", "NSColor", "NSEvent", "NSGraphics", "NSResponder", "NSRunningApplication", "NSView", "NSWindow"] }
objc2-screen-capture-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "SCScreenshotManager", "SCShareableContent", "SCStream", "block2", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }
objc2-core-media = { version = "0.3", optional = true, default-features = false, features = ["std", "CMSampleBuffer", "objc2-core-video"] }
objc2-core-video = { version = "0.3", optional = true, default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-core-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "CFCGTypes", "CFString"] }
objc2-core-graphics = { version = "0.3", optional = true, default-features = false, features = ["std", "CGColorSpace", "CGWindow"] }

[build-dependencies]
windows-bindgen = { version = "0.100", optional = true }

[[test]]
name = "p0-interop"
path = "tests/prototypes/main.rs"

[[test]]
name = "p0-native"
path = "tests/prototypes/native.rs"
required-features = ["prototype-windows"]

[[test]]
name = "p0-macos"
path = "tests/prototypes/macos_main.rs"
harness = false
required-features = ["prototype-macos"]

[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"
