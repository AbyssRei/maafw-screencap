# Private daemon: no host devices, portal, general session manager or default
# remote. P0 creates its own links; source-context mode starts an independently
# owned, strictly scoped route supervisor for the original AUTOCONNECT request.
context.properties = {
    core.daemon = true
    core.name = mfs-p0-pipewire
    support.dbus = false
    default.clock.rate = 48000
    default.clock.quantum = 1024
    link.max-buffers = 16
}
context.spa-libs = {
    support.* = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-link-factory }
    # Explicit unrestricted access for the private 0700 test socket. No session
    # manager/portal grants permissions in this owned fixture.
    { name = libpipewire-module-access args = { access.legacy = true } }
]
