# Private test daemon: no host devices, portal, session manager or default remote.
context.properties = {
    core.daemon = true
    core.name = mfs-p0-pipewire
    default.clock.rate = 48000
    default.clock.quantum = 1024
    link.max-buffers = 16
}
context.spa-libs = {
    support.* = support/libspa-support
    videotestsrc = videotestsrc/libspa-videotestsrc
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-access args = { access.force = unrestricted } }
]
context.objects = [
    { factory = spa-node-factory args = {
        factory.name = support.node.driver
        node.name = mfs-p0-driver
        priority.driver = 20000
    } }
    { factory = spa-node-factory args = {
        factory.name = videotestsrc
        node.name = mfs-p0-fixture
        media.class = Video/Source
        node.description = "Owned native SPA video fixture"
    } }
]
