name: P0 preparation and prototypes

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-and-validate:
    name: P0 tools (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            expected_target: x86_64-pc-windows-msvc
            desktop: --desktop
          - os: ubuntu-latest
            expected_target: x86_64-unknown-linux-gnu
            desktop: ''
          - os: macos-latest
            expected_target: aarch64-apple-darwin
            desktop: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Update nightly before configuring Cargo caches
        run: rustup update nightly --no-self-update
      - name: Configure external cache and evidence directories
        shell: pwsh
        run: |
          $siblingRoot = Split-Path -Parent $env:GITHUB_WORKSPACE
          "CARGO_HOME=$(Join-Path $siblingRoot 'maafw-screencap-deps/cargo-home')" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$(Join-Path $siblingRoot 'maafw-screencap-deps/target')" >> $env:GITHUB_ENV
          "MFS_REFERENCE_ROOT=$(Join-Path $siblingRoot 'maafw-screencap-reference')" >> $env:GITHUB_ENV
      - name: Verify native runner OS and architecture
        shell: pwsh
        run: |
          $identity = rustc -vV | Out-String
          $hostLine = ($identity -split "`n" | Where-Object { $_ -match '^host: ' })
          if ($hostLine.Trim() -ne 'host: ${{ matrix.expected_target }}') {
            throw "Unexpected native runner target: $hostLine"
          }
      - name: Resolve current dependencies and archive fixed sources
        run: cargo xtask reference prepare
      - name: Validate tools and implemented prototypes, recording missing gates
        if: runner.os == 'macOS'
        run: cargo xtask batch
      - name: Validate Linux native PipeWire prototype
        if: runner.os == 'Linux'
        run: cargo xtask pipewire-prototype
      - name: Validate Windows native interop and independent reference
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask native --desktop
      - name: Verify archived inputs and results
        if: always()
        run: cargo xtask reference verify
      - name: Archive engineering evidence
        if: always()
        shell: pwsh
        run: |
          # tar preserves empty Git directories, symlinks and executable modes.
          $packageRoot = Join-Path (Split-Path -Parent $env:CARGO_HOME) 'evidence'
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          $archive = Join-Path $packageRoot 'p0-evidence.tar'
          "MFS_EVIDENCE_ARCHIVE=$archive" >> $env:GITHUB_ENV
          $restored = Join-Path $packageRoot 'restored'
          ./scripts/archive-evidence.ps1 -ReferenceRoot $env:MFS_REFERENCE_ROOT -ArchivePath $archive -RestoreRoot $restored
      - name: Upload engineering evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p0-evidence-${{ matrix.os }}
          path: ${{ env.MFS_EVIDENCE_ARCHIVE }}
          if-no-files-found: error
