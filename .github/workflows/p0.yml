name: Native preparation and partial P1 migration

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  # PR and default manual validation retain the complete native matrix.
  pull_request:
  workflow_dispatch:
    inputs:
      framepool_only:
        description: Run the FramePool component on a fresh Windows runner
        type: boolean
        required: false
        default: false
      macos_runner:
        description: Select the native Mac environment for the full matrix
        type: choice
        options:
          - xcode-27
          - macos-26
        required: false
        default: xcode-27

permissions:
  contents: read

jobs:
  prepare-and-validate:
    if: ${{ !inputs.framepool_only }}
    name: Native checks (${{ matrix.os }})
    env:
      # Validate the contributor subject while compiling the normal merge tree.
      MFS_COMMIT_MESSAGE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      MFS_TOOLCHAIN_POLICY: preinstalled
      MFS_WINDOWS_SHARED_NATIVE_INPUTS: ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            expected_target: x86_64-pc-windows-msvc
            desktop: --desktop
          - os: ubuntu-latest
            expected_target: x86_64-unknown-linux-gnu
            desktop: ''
          - os: ${{ inputs.macos_runner || 'xcode-27' }}
            expected_target: aarch64-apple-darwin
            desktop: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check independent FramePool diagnostic sequencing
        shell: pwsh
        run: ./tests/prototypes/framepool-independent.ps1
      - name: Check installed toolchain policy controls
        shell: pwsh
        run: ./tests/prototypes/toolchain-policy.ps1
      - name: Check explicit shared native input selection
        shell: pwsh
        run: ./tests/prototypes/native-shared-inputs.ps1
      - name: Prepare usable nightly before configuring Cargo caches
        shell: pwsh
        run: ./scripts/prepare-rust-toolchain.ps1
      - name: Configure external cache and evidence directories
        shell: pwsh
        run: |
          $siblingRoot = Split-Path -Parent $env:GITHUB_WORKSPACE
          "CARGO_HOME=$(Join-Path $siblingRoot 'maafw-screencap-deps/cargo-home')" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$(Join-Path $siblingRoot 'maafw-screencap-deps/target')" >> $env:GITHUB_ENV
          "MFS_REFERENCE_ROOT=$(Join-Path $siblingRoot 'maafw-screencap-reference')" >> $env:GITHUB_ENV
      - name: Verify native runner OS and architecture
        shell: pwsh
        run: |
          $identity = rustc -vV | Out-String
          $hostLine = ($identity -split "`n" | Where-Object { $_ -match '^host: ' })
          if ($hostLine.Trim() -ne 'host: ${{ matrix.expected_target }}') {
            throw "Unexpected native runner target: $hostLine"
          }
      - name: Resolve current dependencies and archive fixed sources
        shell: pwsh
        run: |
          cargo xtask reference prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask reference prepare-fork --revision client-confirmed-4140ac96 --head 4140ac9674a9fde174212c895c8c37ff3acf1ef8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows SDK servicing cache identity
        shell: pwsh
        run: ./tests/prototypes/sdk_cache.ps1
      - name: Prepare available VS2026 Build Tools and Windows SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows-toolchain.ps1 -Install -RecordRoot (Join-Path $env:MFS_REFERENCE_ROOT local)
      - name: Validate native macOS ScreenCaptureKit prototype
        if: runner.os == 'macOS'
        run: cargo xtask macos-prototype
      - name: Observe original macOS ScreenCaptureKit source contexts
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask upstream-context macos
      - name: Upload macOS source diagnostics
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: p1-macos-source-diagnostics
          path: |
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-macos-context-*/manifest.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-macos-context-*/native-result.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-macos-context-*/inputs/source-reference/*-info-*.inc
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-macos-context-*/inputs/source-reference/reference-compile-commands.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-macos-context-*/inputs/source-reference/original-source-identities.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-macos-context-*/inputs/source-reference/clang-ast/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-macos-context-*/inputs/source-reference/source-context-scope.txt
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-macos-context-*/inputs/source-reference/scene-executable-identity.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-macos-context-*/inputs/source-reference/meojson-*.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-macos-context-*/inputs/source-reference/meojson-LICENSE
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-macos-context-*/inputs/custom-reference/*.inc
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-macos-context-*/inputs/custom-reference/*.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-macos-context-*/inputs/custom-reference/*LICENSE*
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-macos-context-*/inputs/custom-reference/source-scope.txt
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-macos-context-*/inputs/custom-reference/native-api-source/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-macos-context-*/macos-arm64/logs/*.log
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-macos-context-*/macos-arm64/reference-u/artifacts/**
          if-no-files-found: warn
      - name: Validate Linux native PipeWire prototype
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask pipewire-prototype
      - name: Upload Linux PipeWire prototype diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: p0-linux-pipewire-diagnostics
          path: |
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p0-pipewire-linux-*/manifest.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p0-pipewire-linux-*/native-result.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p0-pipewire-linux-*/linux-x64-pipewire/logs/*.log
          if-no-files-found: warn
      - name: Validate Linux native Wlr screencopy prototype
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask wlr-prototype
      - name: Upload Linux Wlr prototype diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: p0-linux-wlr-diagnostics
          path: |
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p0-wlr-linux-*/manifest.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p0-wlr-linux-*/native-result.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p0-wlr-linux-*/linux-x64-wlr/logs/*.log
          if-no-files-found: warn
      - name: Observe original PipeWire native source lifecycles
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask upstream-context pipewire
      - name: Upload Linux PipeWire component diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: p1-linux-pipewire-diagnostics
          path: |
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-pipewire-context-linux-*/manifest.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-pipewire-context-linux-*/native-result.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-pipewire-context-linux-*/inputs/source-reference/configuration-*/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-pipewire-context-linux-*/inputs/source-reference/compat/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-pipewire-context-linux-*/inputs/source-reference/kwin-native-abi-source/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-pipewire-context-linux-*/inputs/source-reference/linux-manager-info.inc
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-pipewire-context-linux-*/inputs/source-reference/none-*.h
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-pipewire-context-linux-*/inputs/source-reference/config-oracle-sources/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-pipewire-context-linux-*/inputs/source-reference/meojson-*.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-pipewire-context-linux-*/inputs/source-reference/meojson-LICENSE
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-pipewire-context-linux-*/inputs/source-reference/*-info-*.inc
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-pipewire-context-linux-*/inputs/custom-reference/*.inc
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-pipewire-context-linux-*/inputs/custom-reference/*.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-pipewire-context-linux-*/inputs/custom-reference/*LICENSE*
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-pipewire-context-linux-*/inputs/custom-reference/source-scope.txt
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-pipewire-context-linux-*/inputs/custom-reference/native-api-source/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-pipewire-context-linux-*/linux-x64-pipewire/logs/*.log
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-pipewire-context-linux-*/linux-x64/reference-u/artifacts/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-pipewire-context-linux-*/linux-x64/rust-shm/artifacts/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-pipewire-context-linux-*/linux-x64/rust-fd/artifacts/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-pipewire-context-linux-*/linux-x64/rust-opencv/artifacts/**
          if-no-files-found: warn
      - name: Validate partial Wlr migration and original recursive dispatch
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask upstream-context wlr
      - name: Upload Linux Wlr source diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: p1-linux-wlr-diagnostics
          path: |
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-wlr-context-linux-*/manifest.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-wlr-context-linux-*/native-result.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-wlr-context-linux-*/linux-x64-wlr/logs/*.log
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-wlr-context-linux-*/linux-x64/reference-u/artifacts/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-wlr-context-linux-*/inputs/source-reference/wlr-native-abi-source/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-wlr-context-linux-*/inputs/source-reference/linux-manager-info.inc
          if-no-files-found: warn
      - name: Validate Windows GDI and PrintWindow migration and native interop
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Online components resolve current native versions independently.
          # Verify available native tools and record their actual identities.
          ./scripts/prepare-windows-toolchain.ps1 -Install -RecordRoot (Join-Path $env:MFS_REFERENCE_ROOT local)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          . ./scripts/native-shared-inputs.ps1
          $PSNativeCommandUseErrorActionPreference = $false
          $before = @((Get-Content -LiteralPath (Join-Path $env:MFS_REFERENCE_ROOT manifest.json) -Raw | ConvertFrom-Json).runs | ForEach-Object { $_.path })
          cargo xtask upstream-parity print-window
          $nativeExit = $LASTEXITCODE
          Publish-SharedNativeSeed $env:MFS_REFERENCE_ROOT $before $env:GITHUB_ENV
          exit $nativeExit
      - name: Validate partial ScreenDC migration
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shared = @()
          if ($env:MFS_WINDOWS_SHARED_NATIVE_INPUTS) { $shared = @('--offline-inputs', $env:MFS_WINDOWS_SHARED_NATIVE_INPUTS) }
          cargo xtask upstream-parity screen-dc @shared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows ScreenDC diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: p1-windows-screen-dc-diagnostics
          path: |
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-screen-dc-windows-*/manifest.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-screen-dc-windows-*/native-result.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-screen-dc-windows-*/inputs/screen-dc-scope.md
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-screen-dc-windows-*/windows-x64-vs2026-msbuild-release/logs/*.log
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-screen-dc-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/**
          if-no-files-found: warn
      - name: Validate partial DesktopDup and window migration
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shared = @()
          if ($env:MFS_WINDOWS_SHARED_NATIVE_INPUTS) { $shared = @('--offline-inputs', $env:MFS_WINDOWS_SHARED_NATIVE_INPUTS) }
          cargo xtask upstream-parity desktop-dup @shared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows DesktopDup diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: p1-windows-desktop-dup-diagnostics
          path: |
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-desktop-dup-windows-*/manifest.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-desktop-dup-windows-*/native-result.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-desktop-dup-windows-*/inputs/desktop-dup-scope.md
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-desktop-dup-windows-*/windows-x64-vs2026-msbuild-release/logs/*.log
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-desktop-dup-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/**
          if-no-files-found: warn
      - name: Validate partial Custom callback and real ImageBuffer migration
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Custom metadata needs meojson, which earlier screenshot components
          # do not archive. Prepare this component's complete online batch.
          ./scripts/prepare-windows-toolchain.ps1 -Install -RecordRoot (Join-Path $env:MFS_REFERENCE_ROOT local)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask upstream-parity custom
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate partial screenshot-manager migration
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This component adds its own meojson/original-body oracle. Earlier
          # GDI/ScreenDC/DesktopDup batches did not prepare that offline input.
          ./scripts/prepare-windows-toolchain.ps1 -Install -RecordRoot (Join-Path $env:MFS_REFERENCE_ROOT local)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask upstream-parity manager
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare portable PipeWire consumer model with exact source
        # A host control model, separate from Linux native capture acceptance.
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shared = @()
          if ($env:MFS_WINDOWS_SHARED_NATIVE_INPUTS) { $shared = @('--offline-inputs', $env:MFS_WINDOWS_SHARED_NATIVE_INPUTS) }
          cargo xtask upstream-model pipewire @shared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate partial FramePool migration and original caller contexts
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reuse this job's explicit dependency batch. Source and Rust caller
          # contexts run separately; the scoped component remains P1 incomplete.
          $shared = @()
          if ($env:MFS_WINDOWS_SHARED_NATIVE_INPUTS) { $shared = @('--offline-inputs', $env:MFS_WINDOWS_SHARED_NATIVE_INPUTS) }
          cargo xtask upstream-parity frame-pool @shared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inventory registry licenses and verify prototype configuration
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $index = Get-Content -LiteralPath (Join-Path $env:MFS_REFERENCE_ROOT 'manifest.json') -Raw | ConvertFrom-Json
          $candidate = $null
          foreach ($entry in $index.runs) {
            $record = Get-Content -LiteralPath (Join-Path $env:MFS_REFERENCE_ROOT $entry.path) -Raw | ConvertFrom-Json
            if (@($record.inputs | Where-Object { $_.path.EndsWith('/inputs/dependency-target.txt') }).Count -eq 1) {
              $candidate = $entry
            }
          }
          if ($null -eq $candidate) { throw 'No archived native target dependency graph found' }
          cargo xtask reference licenses $candidate.path
          if ($LASTEXITCODE -ne 0) { throw 'Registry license evidence validation failed' }
          cargo xtask configuration-check --offline-inputs $candidate.path
          if ($LASTEXITCODE -ne 0) { throw 'Prototype build configuration checks failed' }
      - name: Verify archived inputs and results
        if: always()
        run: cargo xtask reference verify
      - name: Upload Windows component diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: p1-windows-component-diagnostics
          path: |
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/manifest.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/native-result.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/inputs/*-info-*.inc
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/inputs/meojson-*.json
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/inputs/meojson-LICENSE
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/inputs/custom-native-api-source/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/inputs/custom-*.inc
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/inputs/custom-source-scope.txt
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/inputs/windows-delegate-*.inc
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/inputs/windows-delegate-*.h
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/inputs/gamepad-host-source/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/inputs/gamepad-runtime-scope.txt
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/inputs/windows-delegate-scope.txt
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/inputs/framepool-device-only.inc
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/inputs/windows-delegate-native-*.txt
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/logs/*.log
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/**/*.bgr
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/**/geometry.txt
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/manager-metadata/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/manager-size-rejection/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/custom-capture/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/windows-delegate/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/gamepad-metadata/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/gamepad-host/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/windows-delegate-native/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/windows-delegate-factory/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/windows-delegate-queries/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/windows-delegate-destroy/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/windows-delegate-runtime/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/corrected-fork-geometry/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/screen-native-geometry/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/screen-native-pending/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/desktop-dup-source/window-fullscreen/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/desktop-dup-source/window-workarea/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/desktop-dup-source/window-geometry/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/desktop-dup-source/map-boundary/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/desktop-dup-source/held-acquisition/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/desktop-dup-source/lifetime/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/desktop-dup-source/initialization/**
            ${{ env.MFS_REFERENCE_ROOT }}/runs/p1-*-windows-*/windows-x64-vs2026-msbuild-release/reference-u/artifacts/desktop-dup-source/primary-output/**
