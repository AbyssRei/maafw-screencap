name: Documentation and commit checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Verify documentation checker failure controls
        run: python3 -B scripts/check-documentation.py --self-test
      - name: Check tracked links, anchors, whitespace and commit subject
        env:
          MFS_COMMIT_MESSAGE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B scripts/check-documentation.py
